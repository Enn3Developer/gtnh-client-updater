name: Release

# Push a tag like v0.2.0 to publish a release: tests run on all three OSes, then the
# binaries and checksums.txt (used by the built-in self-updater) are attached.
on:
  push:
    tags: ['v*.*.*']

permissions:
  contents: read

jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - run: go vet ./...
      - run: go test ./...

  release:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Build
        run: ./build.sh "${GITHUB_REF_NAME}"
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/* \
            --title "gtnh-update ${GITHUB_REF_NAME#v}" \
            --notes-file .github/release-notes.md \
            --generate-notes
